# API Gateway do HelpDesk: um Nginx, só configuração.
# É o único ponto de entrada (porta 8000): serve a tela e encaminha cada rota ao serviço certo.
# Não confere o token: quem confere é cada serviço. Aqui fica o que é de borda.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;

    # O contêiner roda sem root e com o disco só de leitura: os arquivos temporários vão para /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # O DNS interno do Docker. O nome de cada serviço é consultado de novo a cada 10 s, e não só
    # quando o Nginx sobe: o gateway sobe mesmo com um serviço parado e o encontra quando ele volta.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # Limite de requisições por endereço: 20 por segundo no geral e 10 por minuto no login
    limit_req_zone $binary_remote_addr zone=geral:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    server {
        listen 8000;
        root /usr/share/nginx/html;

        # Cabeçalhos de segurança em toda resposta, inclusive nas de erro
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # O que segue para os serviços: o endereço que o Nginx viu (não o que o navegador diz) e nenhum cookie
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;

        # A tela
        location = / {
            try_files /index.html =404;
        }
        location = /app.js { }
        location = /estilo.css { }

        location = /saude {
            default_type application/json;
            return 200 '{"gateway": "no ar"}';
        }

        # O login tem um limite próprio, mais apertado
        location = /auth/login {
            limit_req zone=login burst=5 nodelay;
            set $servico "usuários";
            set $destino http://usuarios:8000;
            proxy_pass $destino;
        }

        location ~ ^/(auth|usuarios)(/|$) {
            limit_req zone=geral burst=40 nodelay;
            set $servico "usuários";
            set $destino http://usuarios:8000;
            proxy_pass $destino;
        }

        location ~ ^/ativos(/|$) {
            limit_req zone=geral burst=40 nodelay;
            set $servico "inventário";
            set $destino http://inventario:8000;
            proxy_pass $destino;
        }

        location ~ ^/chamados(/|$) {
            limit_req zone=geral burst=40 nodelay;
            set $servico "chamados";
            set $destino http://chamados:8000;
            proxy_pass $destino;
        }

        location ~ ^/notificacoes(/|$) {
            limit_req zone=geral burst=40 nodelay;
            set $servico "notificações";
            set $destino http://notificacoes:8000;
            proxy_pass $destino;
        }

        # Qualquer outro caminho nem chega aos serviços
        location / {
            default_type application/json;
            return 404 '{"detail": "Rota não encontrada."}';
        }

        # Os erros do próprio Nginx viram JSON, como os dos serviços
        error_page 502 504 = @fora_do_ar;
        location @fora_do_ar {
            default_type application/json;
            add_header Retry-After "5" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            return 503 '{"detail": "O serviço de $servico está fora do ar. Tente novamente em alguns segundos."}';
        }

        error_page 413 = @grande_demais;
        location @grande_demais {
            default_type application/json;
            return 413 '{"detail": "Requisição grande demais."}';
        }

        error_page 429 = @devagar;
        location @devagar {
            default_type application/json;
            return 429 '{"detail": "Muitas requisições seguidas. Aguarde alguns segundos."}';
        }
    }
}
